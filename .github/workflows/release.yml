name: Release
# npm trusted publishing is configured for this file name; keep it.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  # Retries a release whose publish or GitHub release step failed.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
permissions:
  # npm trusted publishing (OIDC); needs npm 11.5.1 or later.
  id-token: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: npm
      - name: Setup npm
        run: npm install -g npm@11.6.0
      # Each step below is skipped when its part of the release already exists,
      # so merging an unrelated package.json change does nothing.
      - name: Check release state
        id: state
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        if: steps.state.outputs.published == 'false'
        run: npm ci
      - name: Build and lint package
        if: steps.state.outputs.published == 'false'
        run: npx turbo run build lint:tsc lint:biome lint:package --filter=@coder/frimousse
      - name: Publish to npm
        if: steps.state.outputs.published == 'false'
        run: |
          VERSION="${{ steps.state.outputs.version }}"
          # npm requires an explicit dist-tag for prereleases, e.g. 1.0.0-beta.0.
          if [[ "${VERSION}" == *-* ]]; then
            PREID="${VERSION#*-}"
            npm publish --tag "${PREID%%.*}"
          else
            npm publish
          fi
      - name: Create tag and GitHub release
        if: steps.state.outputs.released == 'false'
        run: |
          VERSION="${{ steps.state.outputs.version }}"
          # The changelog section for this version, without its heading.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
